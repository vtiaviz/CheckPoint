# Copie para config.toml e ajuste para a máquina do totem.
# Caminhos relativos são resolvidos a partir da pasta onde o programa é executado.

[camera]
# Índice da webcam no sistema (0 = primeira câmera).
index = 0
# Resolução de captura. A C270 entrega até 1280x720; os modelos trabalham bem em 640x480.
width = 640
height = 480
fps = 30

[storage]
data_dir = "data"
# SQLite no protótipo (um ponto de coleta). Para PostgreSQL, troque a URL.
database_url = "sqlite:///data/checkpoint.db"

[models]
# Pasta dos modelos ONNX (YuNet e SFace). São baixados automaticamente na primeira execução.
dir = "models"

[recognition]
# Limiar de similaridade de cosseno do SFace (0 a 1). O valor de referência do OpenCV Zoo é
# 0.363. Subir reduz falsos aceites; descer reduz recusas de quem está cadastrado.
match_threshold = 0.363
# Confiança mínima do detector YuNet para considerar que há um rosto.
detect_score = 0.8
# Menor lado do rosto, em pixels, para aceitar a captura (rosto pequeno = longe demais).
min_face_size = 80
# Amostras capturadas no cadastro de cada funcionário.
enroll_samples = 7

[liveness]
# Prova de vida antes de aceitar a batida.
enabled = true
# Desafios sorteados por batida (1 ou 2): piscar e/ou virar o rosto para um lado.
challenges = 1
# Tempo máximo, em segundos, para concluir a prova de vida.
timeout_s = 6.0
# Probabilidade mínima de rosto real (0 a 1) no anti-spoofing passivo. Subir barra mais
# fotos e telas; descer reduz recusas de pessoas reais. Calibre com: python -m checkpoint vivacidade
real_threshold = 0.6
# Frames de frente necessários para o anti-spoofing decidir.
min_passive_frames = 3

[punch]
# Intervalo mínimo, em minutos, entre duas batidas do mesmo funcionário (evita duplicadas).
min_interval_min = 2.0
# PINs errados seguidos antes de bloquear a matrícula, e por quantos minutos.
pin_max_attempts = 3
pin_lockout_min = 5.0

[company]
# Dados impressos no comprovante.
name = "Empresa (protótipo)"
cnpj = ""
location = "Portaria"

[receipt]
# Comprovante em PDF aberto pelo celular via QR code, servido na rede local.
enabled = true
port = 8080
# IP ou nome que o celular usa para chegar a este computador. Vazio = detectar sozinho.
host = ""
# Segundos que o QR fica na tela depois da batida (qualquer tecla fecha antes).
qr_seconds = 10.0

[panel]
# Painel web do RH (comando: python -m checkpoint painel).
port = 8081
# "0.0.0.0" aceita acesso de outros computadores da rede; "127.0.0.1" só deste computador.
bind = "0.0.0.0"

[logging]
level = "INFO"
dir = "logs"
